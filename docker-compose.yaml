services:
  postgres:
    image: postgres:16-alpine
    container_name: pm_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: project_management
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "15432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres} -d project_management"]
      interval: 10s
      timeout: 5s
      retries: 5

  eureka-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: infrastructure/Eureka-service
    container_name: pm_eureka_service
    restart: unless-stopped
    ports:
      - "8761:8761"
    environment:
      SERVER_PORT: 8761

  config-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: infrastructure/Config-service
    container_name: pm_config_service
    restart: unless-stopped
    depends_on:
      - eureka-service
    ports:
      - "8888:8888"
    environment:
      SERVER_PORT: 8888
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-service:8761/eureka/
      SPRING_CLOUD_CONFIG_SERVER_NATIVE_SEARCH_LOCATIONS: classpath:/config

  auth-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/auth-service
    container_name: pm_auth_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-service:
        condition: service_started
    ports:
      - "8081:8081"
    environment:
      SERVER_PORT: 8081
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/project_management
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-S3cr3tK3yThatIsAtLeast32CharactersLong!!}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-mysecret123}

  project-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/project-service
    container_name: pm_project_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-service:
        condition: service_started
      auth-service:
        condition: service_started
    ports:
      - "8082:8082"
    environment:
      SERVER_PORT: 8082
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/project_management
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-service:8761/eureka/
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-mysecret123}

  task-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/task-service
    container_name: pm_task_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-service:
        condition: service_started
      auth-service:
        condition: service_started
      project-service:
        condition: service_started
    ports:
      - "8083:8083"
    environment:
      SERVER_PORT: 8083
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/project_management
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-service:8761/eureka/
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-mysecret123}

  sprint-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/sprint-service
    container_name: pm_sprint_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-service:
        condition: service_started
      auth-service:
        condition: service_started
    ports:
      - "8084:8084"
    environment:
      SERVER_PORT: 8084
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/project_management
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-service:8761/eureka/
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-mysecret123}

  notification-service:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: services/notification-service
    container_name: pm_notification_service
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      eureka-service:
        condition: service_started
      auth-service:
        condition: service_started
    ports:
      - "8085:8085"
    environment:
      SERVER_PORT: 8085
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/project_management
      SPRING_DATASOURCE_USERNAME: ${DB_USERNAME:-postgres}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-postgres}
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-service:8761/eureka/
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:-mysecret123}

  api-gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: infrastructure/Api-gateway
    container_name: pm_api_gateway
    restart: unless-stopped
    depends_on:
      - eureka-service
      - auth-service
      - project-service
      - task-service
      - sprint-service
      - notification-service
    ports:
      - "8080:8080"
    environment:
      SERVER_PORT: 8080
      EUREKA_CLIENT_SERVICE_URL_DEFAULTZONE: http://eureka-service:8761/eureka/
      AUTH_SERVICE_BASE_URL: http://auth-service:8081

volumes:
  postgres_data:
    driver: local
